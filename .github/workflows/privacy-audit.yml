
name: Sketch Upload Privacy Audit

on:
  push:
    branches:
      - rosie/mannequin-team-pr
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check sketch upload privacy
        shell: pwsh
        run: ./image-upload/privacy-audit.ps1
