
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set up the page and connect the stylesheets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Image Upload</title>

    <!-- CSS files for the website and upload section -->
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <!-- Upload instructions are hidden when an image is selected -->
        <div id="uploadInstructions">
            <h1>Upload Your Sketch</h1>
            <p>Choose a JPG, JPEG, or PNG image, or drag and drop one here.</p>
            <p>Maximum file size: 10 MB.</p>
        </div>

        <!-- File input only accepts JPG, JPEG, and PNG images -->
        <input
            type="file"
            id="sketchUpload"
            accept=".jpg,.jpeg,.png"
        >

        <!-- Display the selected image before and after confirmation -->
        <div id="previewContainer">
            <img id="imagePreview" alt="Uploaded sketch preview" hidden>
        </div>

        <!-- Ask the user to confirm or cancel the selected image -->
        <dialog id="uploadConfirmDialog">
            <h2>Confirm Image Upload</h2>
            <p>Would you like to use this image?</p>

            <button id="confirmUpload" type="button">
                Upload
            </button>

            <button id="cancelUpload" type="button">
                Cancel
            </button>
        </dialog>

        <!-- Remove the current image and clear its saved pose data -->
        <button id="removeImage" type="button" hidden>
            Remove Image
        </button>

        <!-- Select a replacement image without losing the current one until confirmed -->
        <button id="changeImage" type="button" hidden>
            Change Image
        </button>


        <!-- Show upload status, validation errors, and pose detection messages -->
        <p id="uploadMessage" role="status"></p>

    </main>

    <!-- Task 1.2.7 - Load the HPE Worker Controller first -->
    <script src="../scripts/controller/hpe-worker-controller.js"></script>

    <!-- Handle sketch uploading -->
    <script src="script.js"></script>
</body>

</html>
