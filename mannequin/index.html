<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Three.js App Test</title>
    <!--maryam added-->
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="./style.css">
    
    <script type="importmap">
    {
      "imports": {
        "three": "./three.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    
    <style>
      :root {
        --panel-bg: rgba(20, 27, 45, 0.85);
        --text-main: #f0f4f8;
        --accent: #00ffcc;
        --accent-dim: rgba(0, 43, 34, 0.6);
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--color-surface);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Control panel overlay cleanly layered above the 3D context */
      .ui-overlay-panel {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 500px;
        background: var(--panel-bg);
        border: 1px solid #222b45;
        border-radius: 12px;
        padding: 16px;
        box-sizing: border-box;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        gap: 12px;
        z-index: 10;
      }

      .joint-status {
        font-size: 13px;
        color: #8fa0b3;
        background: rgba(0, 0, 0, 0.3);
        padding: 6px 12px;
        border-radius: 6px;
        border-left: 3px solid var(--accent);
      }

      .active-joint-name {
        color: var(--accent);
        font-weight: bold;
      }

      .action-button-group {
        display: flex;
        gap: 8px;
      }

      .btn-transform {
        flex: 1;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #334466;
        color: var(--text-main);
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        outline: none;
        user-select: none;
      }

      .btn-transform:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
        box-shadow: 0 0 8px rgba(0, 255, 204, 0.15);
      }

      .btn-transform:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn-transform:disabled {
        opacity: 0.25;
        cursor: not-allowed;
        border-color: #222b45;
      }
    </style>
  </head>
  <body>
    <div class="ui-overlay-panel">
      <div class="joint-status">
        <span>Active Joint: <span id="lbl-joint-key" class="active-joint-name">None (Click a body part)</span></span>
      </div>
      
      <div class="action-button-group">
        <button id="btn-rotate" class="btn-transform" disabled>Rotate</button>
        <button id="btn-bend" class="btn-transform" disabled>Bend</button>
        <button id="btn-tilt" class="btn-transform" disabled>Tilt</button>
      </div>
    </div>
    <script type="module" src="./main-glb.js"></script>

    <script type="module">
      const lblJointKey = document.getElementById('lbl-joint-key');
      const btnRotate = document.getElementById('btn-rotate');
      const btnBend = document.getElementById('btn-bend');
      const btnTilt = document.getElementById('btn-tilt');

      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'MANNEQUIN_JOINT_SELECTED') {
          const rawKey = event.data.jointKey;
          lblJointKey.textContent =
          rawKey
            .replace('Bone_', '')
            .replaceAll('_', ' ')
            .toUpperCase();
          
          btnRotate.disabled = false;
          btnBend.disabled = false;
          btnTilt.disabled = false;
        }
      });

      function emitTransform(axis, val) {
        window.postMessage({
          type: 'MANNEQUIN_TRANSFORM_JOINT',
          axis: axis,
          angle: val,
          isRelative: true
        }, '*');
      }

      btnRotate.addEventListener('click', () => emitTransform('y', 15));
      btnBend.addEventListener('click', () => emitTransform('x', 15));
      btnTilt.addEventListener('click', () => emitTransform('z', 15));
    </script>

  </body>
</html>
