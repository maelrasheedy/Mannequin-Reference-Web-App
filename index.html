
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1">
    <title>Mannequin Reference</title>

    <!-- CSS files linked here -------------------------------->
        <link rel = "stylesheet" href = "styles/tokens.css">
        <link rel = "stylesheet" href = "styles/base.css">
    <!---------------------------------------------------------->

</head>

<body>

    <!-- nav for TABS: a workspace tab and a help tab -->
    <nav id = "tabs" role = "tablist" aria-label = "Main Sections">
        <button type = "button" role = "tab" id = "tab-workspace"
            aria-controls = "panel-workspace" aria-selected = "true">Workspace</button>
        <button type = "button" role = "tab" id = "tab-help"
            aria-controls = "panel-help" aria-selected = "false">Help</button>
    </nav>

    <header id = "app-header">
        <h1>Mannequin Reference</h1>
    </header>

    <!---------------------------MAIN workspace tab---------------------->
    <main id = "panel-workspace" role = "tabpanel" aria-labelledby = "tab-workspace">

        <!-- banner for erros, warnings, success messages in workspace tab -->
        <div id = "status-banner" role = "status" aria-live = "polite"></div>

        <!-- loading overlay which will cover WHOLE workspace --------------->
        <div id = "loading-overlay" hidden>
            <div id = "loading-spinner"></div>
            <p>Loading...</p>
        </div>

        <!----------workspace columns---------------------------------------->
        <div id = "workspace-columns">

            <!-- Here I am adding an OR between the mannequin and sketch upload options -->
            <div id="choice-or">OR</div>

            <!--Left column holds the mannequin viewport and whatever tools-->
            <section id = "viewport" aria-label = "3D mannequin">

                <div id="canvas-mount">

                    <!-- Here I am showing the 3D mannequin in a square on the left side -->

                    <!-- Here I am letting the main CSS control the mannequin's size -->
                    <iframe
                        src="mannequin/index.html"
                        title="3D mannequin preview"
                    ></iframe>

                </div>

                <div id="tool-buttons">
                    <!-- Here I am keeping only the mannequin controls underneath the 3D model -->
                    <button type="button" id="rotate-button">Rotate</button>
                    <button type="button" id="bend-button">Bend</button>
                    <button type="button" id="tilt-button">Tilt</button>
                </div>

            </section>

            <!--Right column will hold the search button and results--------------->
            <section id = "results-column" aria-label = "Search and Results">

                <!-- Here I am letting the main CSS control the upload section's size -->
                <iframe
                    src="image-upload/index.html"
                    title="Upload your own sketch"
                ></iframe>

            </section>

        </div><!---------------------------end workspace columns---------------->

        <!-- Here I am placing the Search button and reference gallery below both options -->
        <section id="search-results">
            <button type="button" id="search-button" disabled>Search</button>

            <div id="results-gallery" aria-label="Reference Image Results">
                <div id="gallery-grid">
                    <p>Reference Image Results Gallery Will Go Here</p>
                </div>
            </div>
        </section>

        <!--enlarged image view: when user clicks a pic in the results gallery--->
        <dialog id = "image-viewer" aria-label= "Enlarged Reference Image">
            <img id = "enlarged-image" src = "" alt = "">
            <div id = "viewer-buttons">
                <button type = "button" id = "download-button">Download</button>
                <button type = "button" id = "close-viewer-button">Close</button>
            </div>
        </dialog>

    </main><!-------------------------end of main workspace tab -------------->

    <!-----------HELP tab ----------------------------------------------------->
    <section id = "panel-help" role = "tabpanel" aria-labelledby = "tab-help" hidden>
        <h2>Help</h2>
        <p>Instructions for mannequin, upload, search, and results will remain on this tab</p>
    </section>

    <!-------------------------where the javascript files will remain----->
    <script src= "scripts/view/tabs.js"></script>

</body>
</html>
